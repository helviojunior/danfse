[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "danfse"
dynamic = ["version"]
description = "Gerador da DANFSe (Documento Auxiliar da NFS-e Nacional) em PDF a partir do XML"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Helvio Junior" }]
keywords = ["nfse", "danfse", "nota fiscal", "pdf", "brasil", "fiscal", "sefin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Printing",
]
dependencies = [
    "weasyprint>=60",
    "jinja2>=3.1",
    "lxml>=5.0",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf>=4", "ruff>=0.6", "build>=1.2", "twine>=5"]

[project.scripts]
danfse = "danfse.cli:main"

[project.urls]
Homepage = "https://github.com/helviojunior/danfse"
Repository = "https://github.com/helviojunior/danfse"
Issues = "https://github.com/helviojunior/danfse/issues"
Changelog = "https://github.com/helviojunior/danfse/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/danfse/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/danfse"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/CHANGELOG.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # comprimento de linha: expressões longas do port de buildData

[tool.pytest.ini_options]
testpaths = ["tests"]
