name: Publish to PyPI

# Publica no PyPI ao criar uma tag vX.Y.Z, usando um token da API do PyPI
# guardado no secret PYPI_API_TOKEN do repositório.
# (Crie o token em https://pypi.org/manage/account/token/ — escopo "Entire
#  account" no primeiro envio, pois o projeto ainda não existe — e adicione em
#  Settings → Secrets and variables → Actions → New repository secret.)

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist e wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verifica os artefatos
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publica no PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
