name: Publish to PyPI

# Publica no PyPI ao criar uma tag vX.Y.Z, usando um token da API do PyPI
# guardado no secret PROD_PYPI_PASSWORD do repositório.
# (Token criado em https://pypi.org/manage/account/token/; no primeiro envio
#  precisa ser de escopo "Entire account" — depois pode ser restrito ao
#  projeto. Há também TEST_PYPI_PASSWORD para publicar no TestPyPI, se desejado.)

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist e wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verifica os artefatos
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publica no PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PROD_PYPI_PASSWORD }}
