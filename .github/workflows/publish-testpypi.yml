name: Publish to TestPyPI

# Dry-run manual (aba Actions → "Publish to TestPyPI" → Run workflow): empacota
# e envia o estado atual ao TestPyPI usando o secret TEST_PYPI_PASSWORD.
#
# Atenção: o TestPyPI NÃO aceita reenviar uma versão já publicada. Para testar,
# use uma versão ainda não enviada — ex.: sufixo de desenvolvimento/pré-release
# em src/danfse/__about__.py (0.2.0.dev1, 0.2.0rc1 etc.).

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist e wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verifica os artefatos
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist-testpypi
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-testpypi
          path: dist/
      - name: Publica no TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TEST_PYPI_PASSWORD }}
          repository-url: https://test.pypi.org/legacy/
